{% extends 'userbase.html' %}
{% block user %}
<div class="row">
    <div class="col-sm-12">
                 <h3 class="p-3 border border-1 border-rounded border-success my-greetings" style="background-color: #27ae5f60;border-radius:8px;">Edit Profile :</h3>

        <form method="post" class="row mt-3 g-3" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="col-sm-6" >
                <label for="n" class="form-label" ><strong>Name</strong></label>
                <input type="text" name="name" id="n" class="form-control" value="{{user.name}}" style="background-color: #27ae5f60; border:1px solid green;">
            </div>
             <div class="col-sm-6">
                <label for="cn" class="form-label"><strong>Contact No</strong></label>
                <input type="text" name="contactno" id="cn" class="form-control" value="{{user.contactno}}" style="background-color: #27ae5f60; border:1px solid green;">
            </div>
             <div class="col-sm-6">
                <label for="em" class="form-label"><strong>Eamil</strong></label>
                <input type="email" name="email" id="em" class="form-control" value="{{user.email}}" disabled style="background-color: #27ae5fb5; border:1px solid green;">
            </div>
             <div class="col-sm-6">
                <label for="pic" class="form-label"><strong>Upload Profile</strong></label>
                <input type="file" name="profile" id="pic" class="form-control" style="background-color: #27ae5f60; border:1px solid green;">
            </div>
            <div class="col-sm-12">
                <label for="add" class="form-label"><strong>Address</strong></label>
                <textarea name="address" id="addd" class="form-control" style="background-color: #27ae5f60; border:1px solid green;">{{user.address}}</textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-success" style="width:100px; height:40px;border:1px solid green;"><span class="fa-lg">Save</span></button>
            </div>
        </form>
    </div>
   


</div>


{% endblock %}
