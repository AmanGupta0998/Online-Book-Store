{% extends 'adminbase.html' %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
         <h3 class="p-3 border border-1 border-rounded border-success my-greetings" style="background-color: #27ae5f60;border-radius:8px;">Add Category :</h3>
    </div>
    <div class="col-sm-6 mx-auto mt-5 ">
        <div class="card p-3 shadow border-success" style="background-color:#27ae5f60 ;">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="n" class="form-label">Category Name</label>
                    <input type="text" name="name" id="n" class="form-control" placeholder="Cartegory Name">
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">Description</label>
                    <textarea name="description" id="desc" class="form-control" placeholder="Description"></textarea>
                </div>
                <div class="text-center">
                     <button type="submit" class="btn btn-success" style="background-color:#27ae60;">Add Cartegory</button>
                </div>

            </form>
        </div>
    </div>
</div>



{% endblock %}
