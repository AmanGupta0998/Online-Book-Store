{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<h3>Edit Book - <span class="fst-italic text-success">{{book.title}}</span></h3>
<div class="row">
    <div class="col-sm-10 mx-auto">
        <div class="card p-4">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="title" class="form-label">Book Title</label>
                    <input type="text" name="title" value="{{book.title}}" id="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="auth" class="form-label">Author</label>
                    <input type="text" name="author" value="{{book.author}}" id="auth" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="cat" class="form-label">Select Category</label>
                    <select name="category" id="cat" class="form-select" required>
                        <option value="{{book.category.id}}" selected>{{book.category.name}}</option>
                        {% for c in cats %}
                        {% if book.category.id != c.id %}
                        <option value="{{c.id}}">{{c.name}}</option>
                        {% endif %}
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">Description</label>
                    <textarea name="description" id="desc" class="form-control">{{book.description}}</textarea>
                </div>
                <div class="mb-3">
                    <label for="op" class="form-label">Original Price</label>
                    <input type="number" name="original_price" value="{{book.original_price}}" step="0.01" id="op" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="p" class="form-label">Price</label>
                    <input type="number" name="price" step="0.01" value="{{book.price}}" id="p" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="date" class="form-label">Published Date - <span class="fw-bold">{{book.published_date}}</span> (Add new date, otherwise leave blank)</label>
                    <input type="date" name="published_date"  id="date" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="lang" class="form-label">Language</label>
                    <input type="text" name="language" value="{{book.language}}" id="lang" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="ci" class="form-label">Cover Image</label>
                    <input type="file" name="cover_image" id="ci" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="st" class="form-label">Stock</label>
                    <input type="number" name="stock" value="{{book.stock}}" id="st" class="form-control">
                </div>
                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success">Update Book</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
