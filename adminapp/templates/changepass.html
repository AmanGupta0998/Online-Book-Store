{% extends 'adminbase.html' %}
{% block admin %}
<div class="row">
    <div class="col-sm-12">
                 <h3 class="p-3 border border-1 border-rounded border-success my-greetings" style="background-color: #27ae5f60;border-radius:8px;">Change Password :</h3>

        <div class="row">
            <div class="col-sm-4 mx-auto mt-5">
                <div class="card p-4 shadow">
                    <h3 class="text-center mt-1 mb-4">Change Password</h3>
                    <form method="post" class="row">
                        {% csrf_token %}
                        <h6><i class="fa-solid fa-key fa-xl me-1" style="color: #27ae60;"></i>Current Password<span
                                class="text-danger ms-1">*</span></h6>
                        <div class="form-floating">
                            <input type="password" name="oldpwd" class="form-control rounded-pill" id="floatingPassword"
                                placeholder="Current Password" required>
                            <label class="ms-3" for="floatingPassword">Current Password</label>
                        </div>
                        <h6 class="mt-3"><i class="fa-solid fa-key fa-xl me-1" style="color: #27ae60;"></i>New
                            Password<span class="text-danger ms-1">*</span></h6>
                        <div class="form-floating">
                            <input type="password" name="newpwd" class="form-control rounded-pill" id="floatingPassword"
                                placeholder="New Password" required>
                            <label class="ms-3" for="floatingPassword"> New Password</label>
                        </div>
                        <h6 class="mt-3"><i class="fa-solid fa-key fa-xl me-1" style="color: #27ae60;"></i>Confirm
                            Password<span class="text-danger ms-1">*</span></h6>
                        <div class="form-floating">
                            <input type="password" name="confirmpwd" class="form-control rounded-pill" id="floatingPassword"
                                placeholder="Confirm Password" required>
                            <label class="ms-3" for="floatingPassword">Confirm Password</label>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success mt-3 rounded-pill "
                            style="height:55px; background-color:#27ae60; width:330px">
                            <h5 class="mt-2 text-light">Update Password</h5>
                        </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>



{% endblock %}
