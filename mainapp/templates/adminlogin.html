{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="container-fluid">
        <div class="row" style="height: 100vh;background-color:#27ae60">
            <div class="col-sm-4 mx-auto my-auto">
                <div class="card p-4">
                    <div class="text-center">
                    <img class="m-1" src="{% static 'img/my-logo1.png' %}" alt="" height="70px" width="150px">


                    </div>
                    <h4 class="text-center">Welcome Admin</h4>
                     {% if messages %}
                     {% for m in messages %}
                         <div class="alert alert-success alert-dismissible fade show" role="alert">
                            {{m}}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                         </div>
                     {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Username">
                            <label for="floatingInput">Username</label>
                        </div>
                        <div class="form-floating">
                            <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password">
                            <label for="floatingPassword">Password</label>
                        </div>
                        <button type="submit" class="btn btn-success mt-4 w-100"> Login</button>
                        <p class="mt-5">&copy; OBS <a href="{% url 'index' %}" class="float-end fw-semibold">Back to Home</a></p>
                    </form>

                </div>
            </div>
        </div>
    </div>




    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
</body>

</html>
