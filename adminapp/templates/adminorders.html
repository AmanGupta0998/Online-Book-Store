{% extends 'adminbase.html' %}
{% block admin %}

<div class="row">
    <div class="col-sm-12">
        <h3>View Orders</h3>
    </div>
    <table class="table">
        <tr>
            <th>
                S.No
            </th>
            <th>Order Id</th>
            <th>Ordered By</th>
            <th>Ordered At</th>
            <th>Order Amount</th>
        </tr>
        {% for x in orders %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{x.id}}</td>
            <td>{{x.user.name}}</td>
            <td>{{x.ordered_at}}</td>
            <td>{{x.total_amount}}</td>
        </tr>

        {% endfor %}
    </table>
</div>

{% endblock %}
